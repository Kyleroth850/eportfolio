<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download My Android App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .version {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .description {
      color: #555;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .download-btn {
      display: inline-block;
      background-color: #3ddc84; /* Android Green */
      color: #000000;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 1rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .download-btn:hover {
      background-color: #32c373;
    }

    .download-btn:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #777;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Spanish Translator APp</h1>
    <div class="version">Version 1.0</div>
    <p class="description">
      An app that translates English to Spanish right on your phone. You can also hear it speak the pronunciation of the Spanish phrases!
    </p>

    <!-- REPLACE THE LINK BELOW WITH YOUR APK DOWNLOAD URL -->
    <a href="https://example.com/path/to/your-app.apk" class="download-btn" download>
      Download APK
    </a>

    <p class="note">
      Note: You may need to allow "Install from unknown sources" in your Android settings to install this file.
    </p>
  </div>

</body>
</html>
